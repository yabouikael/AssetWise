<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop dashboard — AssetWise</title><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:11px"><button class="icon-btn mobile-menu" id="mobile-menu" type="button" aria-label="Toggle navigation">☰</button><a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">A</span><span id="shop-name-brand">AssetWise</span></a></div>
      <div class="topbar-actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode">☾</button><div class="user-chip">
      <div class="avatar" id="admin-avatar"></div>
      <div class="user-name"><strong id="admin-name">Admin</strong>
        <div class="small muted">Administrator</div>
      </div>
      </div>
      <button class="btn btn-sm" type="button" data-logout>Log out</button>
    </div>
    </header>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar">
        <div class="nav-label">Workspace</div>
        <nav class="nav-list" aria-label="Admin navigation">
          <a class="nav-item active" href="#overview" data-section="overview"><span class="nav-icon">▦</span>Overview</a>
          <a class="nav-item" href="#inventory" data-section="inventory"><span class="nav-icon">▤</span>Asset inventory</a>
          <a class="nav-item" href="#repairs" data-section="repairs"><span class="nav-icon">⌁</span>Repairs</a>
          <a class="nav-item" href="#consultations" data-section="consultations"><span class="nav-icon">✉</span>Consultations<span class="nav-count" id="pending-consultation-count">0</span></a>
          <a class="nav-item" href="#schedule" data-section="schedule"><span class="nav-icon">◷</span>Scheduling</a>
          <a class="nav-item" href="#customers" data-section="customers"><span class="nav-icon">♙</span>Customers</a>
        </nav>
        <div class="nav-label">Preferences</div>
        <nav class="nav-list"><a class="nav-item" href="#settings" data-section="settings"><span class="nav-icon">⚙</span>Settings</a></nav>
      </aside>
      <main class="main-content"><div class="content-container" id="admin-content"><div class="empty">Loading your workspace…</div></div></main>
    </div>
  </div>
  <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
</body>
</html>
